name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned by commit; the comment names the reviewed tag.
# No dependency or build caches: release builds must not restore state
# written by other workflow runs.
jobs:
  android:
    name: 签名 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Only this job sees the signing key, and it cannot write to the repository.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: 安装 Android SDK 组件
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-36" "build-tools;35.0.0"
      # versionCode = major * 1000000 + minor * 1000 + patch, so every
      # release installs over the previous one; a pre-release shares the
      # code of its final version.
      - name: 构建并签名 release APK
        env:
          TAG: ${{ github.ref_name }}
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          VVIDEO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VVIDEO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          version=${TAG#v}
          IFS=. read -r major minor patch <<<"${version%%-*}"
          if [ $((10#$minor)) -ge 1000 ] || [ $((10#$patch)) -ge 1000 ]; then
            echo "minor and patch must be below 1000 for versionCode" >&2
            exit 1
          fi
          export VVIDEO_VERSION_NAME=$version
          export VVIDEO_VERSION_CODE=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$VVIDEO_KEYSTORE_PASSWORD" ]; then
            echo "ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets are required" >&2
            exit 1
          fi
          export VVIDEO_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$VVIDEO_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d >"$VVIDEO_KEYSTORE_FILE"

          ./gradlew --no-daemon :app:assembleRelease

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="$RUNNER_TEMP/apk/vvideo_${version}_android.apk"
          mkdir -p "$(dirname "$apk")"
          # Gradle names the output app-release-unsigned.apk without a key.
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          certs=$("$build_tools/apksigner" verify --print-certs "$apk")
          echo "$certs"
          if grep -q "CN=Android Debug" <<<"$certs"; then
            echo "release APK is signed with a debug key" >&2
            exit 1
          fi
          # No pipe into head: with pipefail an early close fails the step.
          badging=$("$build_tools/aapt2" dump badging "$apk")
          sed -n 1p <<<"$badging"
          case "$badging" in
            *"versionCode='$VVIDEO_VERSION_CODE' versionName='$version'"*) ;;
            *) echo "APK version does not match $TAG" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 1

  goreleaser:
    name: GoReleaser 发布
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go mod verify
      # Publish only when Go embeds exactly this tag and a clean tree, the
      # same metadata the GoReleaser builds below carry.
      - name: 核对 tag 与内置版本
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go build -trimpath -o "$RUNNER_TEMP/vvideo" ./cmd/vvideo
          got=$("$RUNNER_TEMP/vvideo" --version)
          want="vvideo $TAG (commit $(git rev-parse HEAD | cut -c1-12), "
          case "$got" in
            "$want"*) echo "$got" ;;
            *) printf 'version mismatch\n  got:  %s\n  want: %s...\n' "$got" "$want" >&2; exit 1 ;;
          esac
      # .goreleaser.yaml attaches bin/android/*.apk and adds it to checksums.txt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-apk
          path: bin/android
      - name: 确认 APK 已就位
        run: |
          count=$(find bin/android -name '*.apk' | wc -l)
          [ "$count" -eq 1 ] || { echo "expected one APK, found $count" >&2; exit 1; }
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
