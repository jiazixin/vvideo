[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose = "2025.12.01"
activity = "1.12.1"
lifecycle = "2.10.0"
media3 = "1.8.1"
coroutines = "1.10.2"
coil = "3.3.0"
datastore = "1.2.0"
room = "2.8.4"
ksp = "2.2.21-2.0.4"
okhttp = "4.12.0"
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-cache = { module = "androidx.media3:media3-datasource", version.ref = "media3" }
media3-db = { module = "androidx.media3:media3-database", version.ref = "media3" }
coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
coil = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil" }
coil-network = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
datastore = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
room = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version = "4.13.2" }
android-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
android-test-junit = { module = "androidx.test.ext:junit", version = "1.3.0" }
android-test-core = { module = "androidx.test:core", version = "1.7.0" }
benchmark-macro = { module = "androidx.benchmark:benchmark-macro-junit4", version = "1.4.1" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version = "2.3.0" }
errorprone-annotations = { module = "com.google.errorprone:error_prone_annotations", version = "2.38.0" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version = "1.4.1" }
[plugins]
android-test = { id = "com.android.test", version.ref = "agp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
